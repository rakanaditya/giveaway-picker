<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giveaways Picker - Admin Panel</title>
  <link rel="stylesheet" href="/css/admin.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 🔹 Header Title ala Otakudesu -->
  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title">GIVEAWAYS PICKER</h1>
      <span class="site-subtitle">Panel Kontrol Administrator</span>
    </div>
  </header>

  <!-- 🔹 Menu Navbar ala Otakudesu -->
  <nav class="otaku-navbar">
    <div class="nav-container">
      <a href="/home">HOME</a>
      <a href="/shop">SHOP</a>
      <a href="/about">TENTANG</a>
      <a href="/login">LOGIN</a>
      <a href="/register">REGISTER</a>
      <a href="/event">EVENT</a>
      <a href="/info">TENTANG WEBSITE</a>
      <a href="/music">MUSIC</a>
    </div>
  </nav>

  <!-- 🔹 Main Content -->
  <main class="main-wrapper">
    <div class="container giveaway-box">
      <h2>🎛️ Admin Panel Giveaway</h2>
      <p class="admin-badge">👤 Login sebagai: <strong id="adminUser"></strong></p>

      <!-- Bagian 1: Jadwal -->
      <div class="admin-section">
        <h3>🕒 Atur Jadwal Giveaway</h3>
        <div class="form">
          <div class="form-group">
            <label for="startTimeInput">Waktu Mulai</label>
            <input type="datetime-local" id="startTimeInput" />
          </div>
          <div class="form-group">
            <label for="endTimeInput">Waktu Selesai</label>
            <input type="datetime-local" id="endTimeInput" />
          </div>
          <button type="button" onclick="saveDeadline()" class="btn-silver-jp">💾 Simpan Jadwal</button>
        </div>
      </div>

      <hr class="divider" />

      <!-- Bagian 2: Daftar Peserta & Undi Pemenang -->
      <div class="admin-section">
        <h3>👥 Peserta Terdaftar (<span id="participantCount">0</span>)</h3>
        <ul id="adminParticipantsList" class="participants-list">
          <li class="empty-text">Memuat data peserta...</li>
        </ul>
        <button type="button" onclick="pickWinner()" class="btn-silver-jp btn-primary-accent">🏆 Acak & Tetapkan Pemenang</button>
      </div>

      <hr class="divider" />

      <!-- Bagian 3: Reset -->
      <div class="admin-section">
        <h3>🧹 Manajemen & Reset</h3>
        <button type="button" onclick="resetPeserta()" class="btn-silver-jp btn-danger">🚨 Reset Giveaway & Hapus Peserta</button>
      </div>

      <div id="statusMsg" class="status-message"></div>

      <div style="margin-top: 20px;">
        <button type="button" onclick="logout()" class="btn-silver-jp">🔓 Logout</button>
      </div>
    </div>
  </main>

  <!-- 🔹 Footer ala Otakudesu -->
  <footer class="otaku-footer">
    <div class="footer-links">
      <a href="/about">About</a>
      <span>|</span>
      <a href="/info">Tentang</a>
      <span>|</span>
      <a href="/event">Tips</a>
    </div>
    <div class="footer-copy">
      &copy; rakanaditya 2026
    </div>
  </footer>

  <script>
    const user = JSON.parse(localStorage.getItem("giveawayUser"));
    if (!user || !user.isAdmin) {
      alert("⛔ Akses admin ditolak!");
      window.location.href = "/login";
    }

    document.getElementById("adminUser").textContent = user.username;
    const statusMsg = document.getElementById("statusMsg");
    const participantsUl = document.getElementById("adminParticipantsList");
    const participantCount = document.getElementById("participantCount");

    function toLocalDatetimeInput(isoString) {
      const date = new Date(isoString);
      const offset = date.getTimezoneOffset() * 60000;
      return new Date(date.getTime() - offset).toISOString().slice(0, 16);
    }

    async function safeJson(res) {
      const text = await res.text();
      try {
        return JSON.parse(text);
      } catch {
        throw new Error("Server error: " + text.slice(0, 80));
      }
    }

    async function loadAdminData() {
      try {
        const res = await fetch("/api/data");
        const data = await safeJson(res);

        if (data.startTime) {
          document.getElementById("startTimeInput").value = toLocalDatetimeInput(data.startTime);
        }
        if (data.endTime) {
          document.getElementById("endTimeInput").value = toLocalDatetimeInput(data.endTime);
        }

        const list = data.participants || [];
        participantCount.textContent = list.length;
        participantsUl.innerHTML = "";

        if (list.length === 0) {
          participantsUl.innerHTML = `<li class="empty-text">Belum ada peserta yang masuk.</li>`;
        } else {
          list.forEach((p, idx) => {
            const li = document.createElement("li");
            li.innerHTML = `<span>#${idx + 1} <strong>${p.username}</strong></span> <span class="badge-num">Angka: ${p.number}</span>`;
            participantsUl.appendChild(li);
          });
        }
      } catch (err) {
        statusMsg.style.color = "#dc2626";
        statusMsg.textContent = "⚠️ Gagal memuat data: " + err.message;
      }
    }

    async function saveDeadline() {
      const startRaw = document.getElementById("startTimeInput").value;
      const endRaw = document.getElementById("endTimeInput").value;

      if (!startRaw || !endRaw) {
        statusMsg.style.color = "#dc2626";
        statusMsg.textContent = "❌ Masukkan waktu mulai dan selesai!";
        return;
      }

      const start = new Date(startRaw);
      const end = new Date(endRaw);

      if (isNaN(start.getTime()) || isNaN(end.getTime())) {
        statusMsg.style.color = "#dc2626";
        statusMsg.textContent = "❌ Format tanggal tidak valid!";
        return;
      }

      if (end <= start) {
        statusMsg.style.color = "#dc2626";
        statusMsg.textContent = "❌ Waktu selesai harus lebih akhir dari waktu mulai!";
        return;
      }

      statusMsg.style.color = "#1e293b";
      statusMsg.textContent = "⏳ Menyimpan jadwal...";

      try {
        const res = await fetch("/api/data", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "setDeadline",
            username: user.username,
            startTime: start.toISOString(),
            endTime: end.toISOString()
          })
        });

        const data = await safeJson(res);

        if (data.success) {
          statusMsg.style.color = "#16a34a";
          statusMsg.textContent = "✅ " + data.message;
        } else {
          statusMsg.style.color = "#dc2626";
          statusMsg.textContent = "❌ " + (data.message || "Gagal menyimpan jadwal");
        }
      } catch (err) {
        statusMsg.style.color = "#dc2626";
        statusMsg.textContent = "❌ Error: " + err.message;
      }
    }

    async function pickWinner() {
      if (!confirm("🏆 Acak dan umumkan pemenang dari peserta saat ini?")) return;

      statusMsg.style.color = "#1e293b";
      statusMsg.textContent = "🎲 Mengundi pemenang...";

      try {
        const res = await fetch("/api/data", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "pickWinner",
            username: user.username
          })
        });

        const data = await safeJson(res);

        if (data.success) {
          statusMsg.style.color = "#16a34a";
          statusMsg.textContent = "🎉 " + data.message;
        } else {
          statusMsg.style.color = "#dc2626";
          statusMsg.textContent = "❌ " + (data.message || "Gagal memilih pemenang");
        }
      } catch (err) {
        statusMsg.style.color = "#dc2626";
        statusMsg.textContent = "❌ Error: " + err.message;
      }
    }

    async function resetPeserta() {
      if (!confirm("⚠️ Yakin ingin mereset seluruh peserta dan pemenang giveaway?")) return;

      statusMsg.style.color = "#1e293b";
      statusMsg.textContent = "🔄 Mereset peserta...";

      try {
        const res = await fetch("/api/data", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "reset",
            username: user.username
          })
        });

        const data = await safeJson(res);

        if (data.success) {
          statusMsg.style.color = "#16a34a";
          statusMsg.textContent = "✅ " + data.message;
          loadAdminData();
        } else {
          statusMsg.style.color = "#dc2626";
          statusMsg.textContent = "❌ " + (data.message || "Gagal reset");
        }
      } catch (err) {
        statusMsg.style.color = "#dc2626";
        statusMsg.textContent = "❌ Gagal reset: " + err.message;
      }
    }

    function logout() {
      localStorage.removeItem("giveawayUser");
      window.location.href = "/login";
    }

    loadAdminData();
  </script>
</body>
</html>
