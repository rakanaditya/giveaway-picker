<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giveaways Picker - Register</title>
  <link rel="stylesheet" href="/css/login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <h1 class="site-title">GIVEAWAYS PICKER</h1>
      <span class="site-subtitle">Platform Undian & Tebak Angka Komunitas</span>
    </div>
  </header>

  <nav class="otaku-navbar">
    <div class="nav-container">
      <a href="/home">HOME</a>
      <a href="/shop">SHOP</a>
      <a href="/about">TENTANG</a>
      <a href="/login">LOGIN</a>
      <a href="/register" class="active">REGISTER</a>
      <a href="/event">EVENT</a>
      <a href="/info">TENTANG WEBSITE</a>
      <a href="/music">MUSIC</a>
    </div>
  </nav>

  <main class="main-wrapper">
    <div class="container giveaway-box">
      <h2>✍️ Daftar Akun Giveaway</h2>
      <form id="registerForm" class="form">
        <input type="text" id="regUsername" placeholder="🧑 Username (min. 3 karakter)" required />
        <input type="password" id="regPassword" placeholder="🔒 Password (min. 4 karakter)" required />
        <button type="submit" class="btn-silver-jp">✅ Daftar Sekarang</button>
        <div id="regStatus" class="status-message"></div>
      </form>

      <div style="margin-top: 22px;">
        <a href="/login" class="btn-silver-jp" style="width: 100%;">
          🔓 Sudah Punya Akun? Login
        </a>
      </div>
    </div>
  </main>

  <footer class="otaku-footer">
    <div class="footer-links">
      <a href="/about">About</a>
      <span>|</span>
      <a href="/info">Tentang</a>
      <span>|</span>
      <a href="/event">Tips</a>
    </div>
    <div class="footer-copy">
      &copy; rakanaditya 2026
    </div>
  </footer>

  <script>
    const form = document.getElementById("registerForm");
    const statusEl = document.getElementById("regStatus");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusEl.style.color = "#1e293b";
      statusEl.textContent = "🔄 Mendaftarkan akun...";

      const username = document.getElementById("regUsername").value.trim();
      const password = document.getElementById("regPassword").value.trim();

      if (username.length < 3 || password.length < 4) {
        statusEl.style.color = "#dc2626";
        statusEl.textContent = "❌ Username min. 3 karakter & password min. 4 karakter!";
        return;
      }

      try {
        const res = await fetch("/api/data", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "register",
            username,
            password
          })
        });

        const data = await res.json();

        if (!data.success) {
          statusEl.style.color = "#dc2626";
          statusEl.textContent = "❌ " + (data.message || "Gagal mendaftar");
          return;
        }

        statusEl.style.color = "#16a34a";
        statusEl.textContent = "✅ " + data.message + "! Mengalihkan...";

        localStorage.setItem("giveawayUser", JSON.stringify({
          username,
          isAdmin: data.isAdmin || false
        }));

        setTimeout(() => {
          window.location.href = data.isAdmin ? "/admin" : "/home";
        }, 1000);

      } catch (err) {
        statusEl.style.color = "#dc2626";
        statusEl.textContent = "❌ Terjadi kesalahan: " + err.message;
      }
    });
  </script>

</body>
</html>
