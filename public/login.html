<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Giveaway</title>
  <!-- CSS Global, Mobile Responsive, & Login Specific Styles -->
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/css/stylemob.css" media="screen and (max-width: 768px)" />
  <link rel="stylesheet" href="/css/logincss.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 🔹 Navigation -->
  <div class="navbar">
    <div><strong>🎁 Giveaway</strong></div>
    <div class="nav-links">
      <a href="/">Beranda</a>
      <a href="/shop">Shop</a>
      <a href="/about">Tentang</a>
      <a href="/login">Login</a>
      <a href="/register">Register</a>
      <a href="/event">Event</a>
      <a href="/info">Tentang Website</a>
      <a href="/music">Music</a>
    </div>
  </div>

  <!-- 🔹 Login Container -->
  <div class="container giveaway-box">
    <h2>🔐 Login Giveaway</h2>
    <form id="loginForm" class="form">
      <input type="text" id="loginUsername" placeholder="🧑 Username" required />
      <input type="password" id="loginPassword" placeholder="🔒 Password" required />
      <button type="submit" class="btn-silver-jp">🔓 Login</button>
      <div id="loginStatus" class="status-message"></div>
    </form>

    <div id="userInfo" style="margin-top:20px;"></div>

    <div class="button-group">
      <a href="https://dyno.gg/form/e462024a" target="_blank" class="btn-silver-jp" style="font-size: 14px; padding: 10px 16px;">
        🔑 Lupa Password
      </a>
      <a href="https://discord.gg/4vNhCF5EHw" target="_blank" class="btn-silver-jp" style="font-size: 14px; padding: 10px 16px;">
        💬 Hubungi Admin via Discord
      </a>
    </div>

    <button id="logoutBtn" class="btn-silver-jp" style="display:none;">🔓 Logout</button>

    <div style="margin-top: 25px;">
      <a href="/register" class="btn-silver-jp" style="width: 100%;">
        ✍️ Daftar Sekarang
      </a>
    </div>
  </div>

  <!-- 🔹 Login Script Logic -->
  <script>
    const form = document.getElementById("loginForm");
    const statusEl = document.getElementById("loginStatus");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusEl.textContent = "🔄 Sedang memproses...";

      const username = document.getElementById("loginUsername").value.trim();
      const password = document.getElementById("loginPassword").value.trim();

      if (username.length < 3 || password.length < 4) {
        statusEl.textContent = "❌ Username/password tidak valid!";
        return;
      }

      try {
        const loginRes = await fetch("/api/data", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "login",
            username,
            password
          })
        });

        const loginData = await loginRes.json();

        if (!loginData.success) {
          statusEl.textContent = "❌ " + (loginData.message || "Gagal login");
          return;
        }

        statusEl.textContent = "✅ " + loginData.message;

        const adminRes = await fetch("/api/admin-auth", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        const result = await adminRes.json();

        localStorage.setItem("giveawayUser", JSON.stringify({
          username,
          isAdmin: result.isAdmin || false
        }));

        window.location.href = result.isAdmin ? "/admin" : "/";

      } catch (err) {
        statusEl.textContent = "❌ Gagal login: " + err.message;
      }
    });
  </script>

</body>
</html>
